[variables]
  NIXPACKS_PATH = "/nix/var/nix/profiles/default"

[start]
  cmd = "python manage.py wait_for_db && python manage.py migrate --noinput && (python manage.py restore_designer_users || true) && python manage.py collectstatic --noinput && gunicorn gdh.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers ${WORKERS:-3}"

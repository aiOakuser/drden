<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="gdhMarkTitle">
  <title id="gdhMarkTitle">Global Designer Hub</title>
  <defs>
    <linearGradient id="gdhGrad" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C992"/>
      <stop offset="0.45" stop-color="#D4A574"/>
      <stop offset="1" stop-color="#C76B4A"/>
    </linearGradient>
    <filter id="gdhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5" result="b"/>

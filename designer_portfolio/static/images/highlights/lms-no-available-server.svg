<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title>No available server screen</title>
  <desc>Black mobile browser screen showing the message "no available server" and a bottom URL bar reading lms.aioak.app.</desc>
  <rect width="1080" height="1920" fill="#0b0b0c"/>
  <text x="80" y="120" fill="#f5f5f5" font-size="42" font-family="Inter, Arial, sans-serif" letter-spacing="1">3:51</text>
  <rect x="900" y="70" width="110" height="44" rx="22" fill="none" stroke="#f5f5f5" stroke-width="4"/>
  <rect x="1008" y="82" width="16" height="20" fill="#f5f5f5"/>
  <circle cx="860" cy="92" r="10" fill="#f5f5f5"/>
  <circle cx="830" cy="92" r="10" fill="#f5f5f5"/>

{% load static %}
<style>
.banner { width: 95%; max-width: 2200px; margin: 70px auto; position: relative; aspect-ratio: 18/7; background: var(--color-surface); border-radius: 50px; overflow: hidden; }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; background-size: cover; background-position: center; }
.slide.is-active { opacity: 1; }
.arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(var(--color-primary-rgb), 0.7); color: var(--color-secondary); border: none; font-size: 32px; padding: 10px 16px; border-radius: 50%; cursor: pointer; z-index: 10; transition: background 0.3s ease; outline: none; }
.arrow:hover, .arrow:focus { background: gold; color: var(--color-primary); }
.arrow.prev { left: 15px; }
.arrow.next { right: 15px; }
.dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 5; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(var(--color-secondary-rgb), 0.65); border: 1px solid rgba(var(--color-primary-rgb), 0.2); cursor: pointer; transition: background 0.3s ease; }
.dot.is-active { background: var(--color-secondary); }
</style>

<section class="banner" aria-label="Featured Carousel">
  <div class="slide is-active" style="background-image: url('{% static 'images/home/1.png' %}')"></div>
  <div class="slide" style="background-image: url('{% static 'images/home/2.png' %}')"></div>
  <div class="slide" style="background-image: url('{% static 'images/home/3.png' %}')"></div>

  <button class="arrow prev" onclick="prevSlide()" aria-label="Previous Slide">‹</button>
  <button class="arrow next" onclick="nextSlide()" aria-label="Next Slide">›</button>

  <div class="dots" role="tablist">
    <span class="dot is-active" role="tab" aria-selected="true"></span>
    <span class="dot" role="tab" aria-selected="false"></span>
    <span class="dot" role="tab" aria-selected="false"></span>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");
    let i = 0;
    let interval = null;
    const SLIDE_DURATION = 4500;

    function showSlide(index) {
      index = (index % slides.length + slides.length) % slides.length;
      slides.forEach((s, idx) => s.classList.toggle("is-active", idx === index));
      dots.forEach((d, idx) => {
        d.classList.toggle("is-active", idx === index);
        d.setAttribute("aria-selected", idx === index);
      });
      i = index;
    }

    window.nextSlide = function() { showSlide(i + 1); }
    window.prevSlide = function() { showSlide(i - 1); }

    function startAutoSlide() { stopAutoSlide(); interval = setInterval(window.nextSlide, SLIDE_DURATION); }
    function stopAutoSlide() { if (interval) clearInterval(interval); }

    dots.forEach((dot, idx) => {
      dot.addEventListener("click", () => { showSlide(idx); stopAutoSlide(); startAutoSlide(); });
    });

    if (slides.length > 0) { showSlide(0); startAutoSlide(); }
  });
</script>

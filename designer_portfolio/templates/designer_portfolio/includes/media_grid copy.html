{% load static %} {% load text_filters %}

<div class="media-grid">
  {% for file in media %}
  <button
    type="button"
    class="card"
    onclick="openPopup({{ forloop.counter0 }})"
  >
    {% if file.type == "video" %}
    <video class="thumb" muted>
      <source src="{{ file.url }}" type="video/mp4" />
    </video>
    {% else %}
    <img src="{{ file.url }}" alt="{{ file.name|prettify }}" class="thumb" />
    {% endif %}
    <!-- ✅ Styled caption -->
    <div class="meta">{{ file.name|prettify }}</div>
  </button>
  {% endfor %}
</div>

<!-- Shared popup -->
<div id="popup" class="popup">
  <button
    type="button"
    class="close"
    onclick="closePopup()"
    aria-label="Close popup"
  >
    &times;
  </button>
  <span class="arrow left" onclick="changePopup(-1)">&#10094;</span>
  <span class="arrow right" onclick="changePopup(1)">&#10095;</span>
  <div class="popup-inner">
    <img
      id="popup-img"
      class="popup-content"
      src=""
      alt="Media preview"
      style="display: none"
    />
    <video
      id="popup-video"
      class="popup-content"
      controls
      style="display: none"
    ></video>
    <!-- ✅ Styled popup caption -->
    <div id="popup-caption" class="caption"></div>
  </div>
</div>

<script>
  // preload all media items
  let mediaItems = [
    {% for file in media %}
      { url: "{{ file.url }}", type: "{{ file.type }}" }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ];
  let currentIndex = 0;

  // ✅ Updated function with decodeURIComponent
  function prettifyFilename(filename) {
    filename = decodeURIComponent(filename);

    return filename
      .replace(/\.[^/.]+$/, "")
      .replace(/[-_]/g, " ")
      .replace(/\w\S*/g, w =>
        w.charAt(0).toUpperCase() + w.substr(1).toLowerCase()
      );
  }

  function openPopup(index) {
    currentIndex = index;
    const popup = document.getElementById("popup");
    const img = document.getElementById("popup-img");
    const video = document.getElementById("popup-video");
    const caption = document.getElementById("popup-caption");
    const item = mediaItems[index];

    if (item.type === "image") {
      img.src = item.url;
      img.style.display = "block";
      video.style.display = "none";
      video.pause();
    } else {
      video.src = item.url;
      video.style.display = "block";
      img.style.display = "none";
    }

    caption.innerText = prettifyFilename(item.url.split("/").pop());
    popup.classList.add("show");
  }

  function closePopup() {
    const popup = document.getElementById("popup");
    const video = document.getElementById("popup-video");
    video.pause();
    popup.classList.remove("show");
  }

  function changePopup(direction) {
    currentIndex = (currentIndex + direction + mediaItems.length) % mediaItems.length;
    openPopup(currentIndex);
  }

  document.addEventListener("keydown", function(e) {
    const popup = document.getElementById("popup");
    if (!popup.classList.contains("show")) return;
    if (e.key === "Escape") closePopup();
    if (e.key === "ArrowRight") changePopup(1);
    if (e.key === "ArrowLeft") changePopup(-1);
  });
</script>

<style>
  /* ✅ Caption under grid items */
  .meta {
    margin-top: 8px;
    font-size: 18px; /* bigger font */
    font-weight: bold; /* bold */
    text-align: center; /* centered */
    color: var(--color-secondary); /* dark text */
    font-family: Garamond, designerf;
  }

  /* ✅ Caption in popup */
  .caption {
    margin-top: 12px;
    font-size: 20px; /* even bigger */
    font-weight: bold;
    text-align: center;
    color: var(--color-primary); /* light text on dark bg */
    font-family: Garamond, designerf;
  }
</style>

{% extends "designer_portfolio/base.html" %}
{% load static %}
{% block content %}
<section class="collections">
  <h1 class="collections-title">Collections</h1>

  <div class="collections-grid">
    {% for col in collections %}
    <div class="collection-item">
      <a href="{% url 'collection_detail' slug=col.slug %}">
        <img src="{{ col.cover }}" alt="{{ col.title }}" />
        <div class="collection-caption">{{ col.title }} – {{ col.year }}</div>
      </a>
    </div>
    {% endfor %}
  </div>
</section>

<style>
  .collections {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
    text-align: center;
  }

  .collections-title {
    font-size: 26px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 30px;
    /* remove underline */
    border-bottom: none;
    display: inline-block;
    padding-bottom: 0;
  }

  .collections-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-gap: 30px;
  }

  .collection-item {
    background: var(--color-secondary);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(var(--color-primary-rgb), 0.1);
    transition: transform 0.3s ease;
  }

  .collection-item:hover {
    transform: translateY(-5px);
    background: var(--color-accent);
  }

  .collection-item img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    display: block;
  }

  .collection-caption {
    background: var(--color-primary);
    color: var(--color-secondary);
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 12px;
    line-height: 1.4;
  }
</style>
{% endblock %}

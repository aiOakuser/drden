{% extends "designer_portfolio/base.html" %}
{% load static %}
{% block content %}
<section class="error-page">
  <div class="error-container">
    <h1>404 — Page Not Found</h1>
    <p>The collection you’re looking for doesn’t exist.</p>
    <a href="{% url 'collections' %}" class="back-btn">← Back to Collections</a>
  </div>
</section>

<style>
  .error-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    text-align: center;
  }

  .error-container h1 {
    font-size: 36px;
    font-weight: 800;
    color: var(--color-primary);
    margin-bottom: 20px;
  }

  .error-container p {
    font-size: 18px;
    color: var(--color-text);
    margin-bottom: 30px;
  }

  .back-btn {
    display: inline-block;
    padding: 10px 20px;
    background: var(--color-primary);
    color: var(--color-secondary);
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
    transition: background 0.3s ease;
  }

  .back-btn:hover {
    background: var(--color-accent);
  }
</style>
{% endblock %}

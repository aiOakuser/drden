{% extends "designer_portfolio/base.html" %}
{% block title %}Password Reset Complete | designer{% endblock %}
{% block content %}
<div class="login-container" style="max-width: 560px; margin: 60px auto; padding: 30px; background: var(--color-secondary); border-radius: 10px; box-shadow: 0 2px 10px rgba(var(--color-primary-rgb), 0.1)">
  <h2 style="text-align: center; margin-bottom: 16px; color: var(--color-primary)">Your password has been changed</h2>
  <p style="text-align: center; color: var(--color-text)">You can now sign in with your new password.</p>
  <div style="margin-top: 18px; text-align: center">
    <a href="{% url 'login' %}" style="color: var(--color-primary); text-decoration: none; font-weight: 600">Go to login</a>
  </div>
</div>
{% endblock %}
